<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDo App - Projekt Zespołowy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h2>Menedżer Zadań</h2>
        <form id="task-form">
            <input type="text" id="task-input" placeholder="Co masz do zrobienia?" required>
            <button type="submit">Dodaj</button>
        </form>
        <ul id="task-list"></ul>
    </div>
    <script src="app.js"></script>
</body>
</html>
